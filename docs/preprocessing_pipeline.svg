<svg viewBox="0 0 560 980" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="560" height="980" fill="#FFFFFF"/>

  <text x="280" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1F3864">Image Preprocessing Pipeline</text>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#666">Applied to every collected image before model training</text>

  <!-- 1. Raw collected images -->
  <rect x="150" y="86" width="260" height="70" rx="12" fill="#DDEBF7" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">Collected Food Images</text>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333">Raw dataset, all classes</text>

  <line x1="280" y1="156" x2="280" y2="192" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. Quality filtering -->
  <rect x="130" y="194" width="300" height="86" rx="12" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#833C0C">Step 1: Quality Filtering</text>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#333">Remove blurry, poorly lit, or</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#333">duplicate images before splitting</text>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#333">into train / validation / test sets</text>

  <line x1="280" y1="280" x2="280" y2="316" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3. Resizing -->
  <rect x="150" y="318" width="260" height="76" rx="12" fill="#E2EFDA" stroke="#548235" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#375623">Step 2: Resizing</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#333">All images resized to 224 &#215; 224 px</text>
  <text x="280" y="384" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4C6B3D">(EfficientNet-B0 input requirement)</text>

  <line x1="280" y1="394" x2="280" y2="430" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4. Normalization -->
  <rect x="150" y="432" width="260" height="80" rx="12" fill="#D5EDEA" stroke="#1B7A72" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F4D47">Step 3: Normalisation</text>
  <text x="280" y="482" text-anchor="middle" font-size="11" fill="#333">Pixel values scaled using</text>
  <text x="280" y="498" text-anchor="middle" font-size="11" fill="#333">standard ImageNet mean / std. values</text>

  <line x1="280" y1="512" x2="280" y2="548" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 5. Augmentation -->
  <rect x="130" y="550" width="300" height="96" rx="12" fill="#EAD1DC" stroke="#A64D79" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="578" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B2A47">Step 4: Data Augmentation</text>
  <text x="280" y="600" text-anchor="middle" font-size="11" fill="#333">Horizontal flip, small rotation,</text>
  <text x="280" y="616" text-anchor="middle" font-size="11" fill="#333">brightness / contrast adjustment</text>
  <text x="280" y="636" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7A4560">Applied during training only, to reduce overfitting</text>

  <line x1="280" y1="646" x2="280" y2="682" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 6. Reference-object portion calibration -->
  <rect x="130" y="684" width="300" height="96" rx="12" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5" filter="url(#sh)"/>
  <text x="280" y="712" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F6000">Step 5: Reference-Object</text>
  <text x="280" y="730" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F6000">Calibration</text>
  <text x="280" y="752" text-anchor="middle" font-size="11" fill="#333">Object beside the plate converts</text>
  <text x="280" y="768" text-anchor="middle" font-size="11" fill="#333">pixel measurements to real-world scale</text>

  <line x1="280" y1="780" x2="280" y2="816" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 7. Output -->
  <rect x="110" y="818" width="340" height="86" rx="12" fill="#D9E2F3" stroke="#2E4E9E" stroke-width="2" filter="url(#sh)"/>
  <text x="280" y="848" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Training-Ready Dataset</text>
  <text x="280" y="870" text-anchor="middle" font-size="11" fill="#333">Cleaned, resized, normalised, augmented</text>
  <text x="280" y="888" text-anchor="middle" font-size="11" fill="#333">images with portion-scale reference</text>

  <text x="280" y="936" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">Fig. 3 &#8212; Five-step preprocessing pipeline applied to every collected image before it reaches</text>
  <text x="280" y="954" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">the EfficientNet-B0 backbone for training.</text>
</svg>
