<svg viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#37474F"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/>
      <stop offset="1" stop-color="#2E75B6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="980" height="900" fill="#FFFFFF"/>

  <!-- Title banner -->
  <rect x="30" y="16" width="920" height="46" rx="8" fill="url(#titleGrad)" filter="url(#sh)"/>
  <text x="490" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Sri Lankan Food Recognition and Calorie Estimation System</text>

  <!-- Input image icon -->
  <g transform="translate(455,80)">
    <rect x="0" y="0" width="70" height="110" rx="10" fill="#2B2B2B"/>
    <rect x="6" y="8" width="58" height="88" rx="3" fill="#FFFFFF"/>
    <circle cx="35" cy="52" r="24" fill="#F5E6C8" stroke="#C9A24B" stroke-width="1.5"/>
    <circle cx="26" cy="45" r="6" fill="#8CB369"/>
    <circle cx="45" cy="48" r="7" fill="#C1502E"/>
    <circle cx="35" cy="62" r="5" fill="#E6B800"/>
    <circle cx="35" cy="100" r="3" fill="#555"/>
  </g>
  <text x="490" y="204" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3864">Input Food Image</text>
  <text x="490" y="220" text-anchor="middle" font-size="10.5" fill="#666">(with reference object for scale)</text>

  <!-- Row 2: Preprocessing + Shared Backbone -->
  <rect x="40" y="252" width="240" height="120" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="280" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3864">Image Acquisition</text>
  <text x="160" y="298" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3864">&amp; Preprocessing</text>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#333">Resize, normalise,</text>
  <text x="160" y="338" text-anchor="middle" font-size="11" fill="#333">augment, reference-object</text>
  <text x="160" y="354" text-anchor="middle" font-size="11" fill="#333">calibration for scale</text>

  <rect x="370" y="252" width="240" height="120" rx="10" fill="#E2EFDA" stroke="#548235" stroke-width="2" filter="url(#sh)"/>
  <text x="490" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#375623">Shared Feature</text>
  <text x="490" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#375623">Extraction</text>
  <text x="490" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#375623">EfficientNet-B0 Backbone</text>
  <text x="490" y="338" text-anchor="middle" font-size="10.5" fill="#333">ImageNet pre-trained, fine-tuned</text>
  <text x="490" y="353" text-anchor="middle" font-size="10.5" fill="#333">on local Sri Lankan food dataset</text>

  <!-- Row 3: Portion Head + Classification Head -->
  <rect x="40" y="440" width="240" height="130" rx="10" fill="#FFF2CC" stroke="#BF8F00" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F6000">Portion Estimation</text>
  <text x="160" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F6000">Head</text>
  <text x="160" y="508" text-anchor="middle" font-size="11" fill="#333">Identifies food regions from</text>
  <text x="160" y="524" text-anchor="middle" font-size="11" fill="#333">shared features</text>
  <text x="160" y="545" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8A6D00">Pixel area scaled via reference object</text>

  <rect x="700" y="440" width="240" height="130" rx="10" fill="#EAD1DC" stroke="#A64D79" stroke-width="1.5" filter="url(#sh)"/>
  <text x="820" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B2A47">Food Classification</text>
  <text x="820" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B2A47">Head</text>
  <text x="820" y="508" text-anchor="middle" font-size="11" fill="#333">Multi-label output, sigmoid</text>
  <text x="820" y="524" text-anchor="middle" font-size="11" fill="#333">activation per dish class</text>
  <text x="820" y="545" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7A4560">Detects several dishes on one plate</text>

  <!-- Row 4: Nutrition DB + Fusion Module -->
  <rect x="40" y="638" width="240" height="120" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)"/>
  <g transform="translate(60,656)">
    <ellipse cx="20" cy="6" rx="20" ry="7" fill="#2E75B6"/>
    <rect x="0" y="6" width="40" height="26" fill="#BDD7EE"/>
    <ellipse cx="20" cy="32" rx="20" ry="7" fill="#9DC3E6"/>
    <ellipse cx="20" cy="6" rx="20" ry="7" fill="none" stroke="#2E75B6" stroke-width="1"/>
  </g>
  <text x="185" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Nutrition Reference</text>
  <text x="185" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Database</text>
  <text x="160" y="710" text-anchor="middle" font-size="10.5" fill="#333">Sri Lankan food composition</text>
  <text x="160" y="726" text-anchor="middle" font-size="10.5" fill="#333">table (kcal per class / 100 g)</text>

  <rect x="370" y="638" width="240" height="140" rx="10" fill="#FCE4D6" stroke="#C55A11" stroke-width="2" filter="url(#sh)"/>
  <text x="490" y="666" text-anchor="middle" font-size="14" font-weight="bold" fill="#833C0C">Calorie Fusion Module</text>
  <text x="490" y="690" text-anchor="middle" font-size="11" fill="#333">Rule-based combination of:</text>
  <text x="490" y="708" text-anchor="middle" font-size="11" fill="#333">food class + portion size</text>
  <text x="490" y="726" text-anchor="middle" font-size="11" fill="#333">+ nutrition lookup</text>
  <text x="490" y="748" text-anchor="middle" font-size="10.5" font-style="italic" fill="#833C0C">Interpretable, no large calorie-labelled dataset needed</text>

  <!-- Row 5: Output -->
  <rect x="330" y="806" width="320" height="78" rx="10" fill="#D9E2F3" stroke="#2E4E9E" stroke-width="2" filter="url(#sh)"/>
  <g transform="translate(350,824)">
    <rect x="0" y="0" width="46" height="34" rx="3" fill="#FFFFFF" stroke="#2E4E9E" stroke-width="2"/>
    <rect x="18" y="34" width="10" height="8" fill="#2E4E9E"/>
    <rect x="9" y="42" width="28" height="4" rx="2" fill="#2E4E9E"/>
    <path d="M5 7 L14 20 L21 13 L30 23 L41 9" fill="none" stroke="#C1502E" stroke-width="2.2"/>
  </g>
  <text x="530" y="838" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">Output</text>
  <text x="530" y="857" text-anchor="middle" font-size="11" fill="#333">Identified dish name(s) +</text>
  <text x="530" y="873" text-anchor="middle" font-size="11" fill="#333">estimated calorie value</text>

  <!-- ===== Orthogonal arrows, all starting/ending at shape mid-points ===== -->
  <!-- Input -> Backbone (vertical) -->
  <line x1="490" y1="228" x2="490" y2="250" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Preprocessing -> Backbone (horizontal, mid-to-mid) -->
  <line x1="280" y1="312" x2="368" y2="312" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Backbone bottom-mid splits to Portion Head and Classification Head -->
  <polyline points="490,372 490,400 160,400 160,438" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>
  <polyline points="490,372 490,400 820,400 820,438" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Portion Head -> Fusion Module (routed through the lane between column 1 and column 2, clear of the Nutrition DB box; enters left edge, upper) -->
  <polyline points="280,505 320,505 320,668 368,668" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Classification Head -> Fusion Module (enters right edge, upper) -->
  <polyline points="820,570 820,668 612,668" fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Nutrition DB -> Fusion Module (enters left edge, lower, horizontal) -->
  <line x1="280" y1="722" x2="368" y2="722" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Fusion -> Output (vertical) -->
  <line x1="490" y1="778" x2="490" y2="804" stroke="#37474F" stroke-width="2" marker-end="url(#ah)"/>

  <text x="490" y="898" text-anchor="middle" font-size="10.5" font-style="italic" fill="#666">Fig. 1 &#8212; Two-headed EfficientNet-B0 architecture: shared backbone with separate classification and portion-estimation heads, fused with a nutrition reference database for calorie output.</text>
</svg>
